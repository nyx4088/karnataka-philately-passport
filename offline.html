<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B2236">
<title>StampQuest — Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F3EBD8;color:#2B1D16;font-family:Georgia,'Times New Roman',serif;padding:24px;text-align:center}
.card{max-width:420px;background:#FBF7EC;border:2px solid #6B2236;border-radius:16px;padding:36px 28px;box-shadow:0 8px 30px rgba(107,34,54,.15)}
.stamp{width:72px;height:72px;margin:0 auto 18px;border:3px dashed #6B2236;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#6B2236}
h1{font-size:24px;color:#6B2236;margin-bottom:10px}
p{font-size:15px;line-height:1.6;margin-bottom:8px}
.kn{font-size:14px;color:#6B5B4C}
button{margin-top:18px;background:#6B2236;color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:16px;min-height:48px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<div class="stamp">✉</div>
<h1>You're offline</h1>
<p>Your stamps are safe on this device.<br>Reconnect to keep exploring Karnataka.</p>
<p class="kn">ನಿಮ್ಮ ಸ್ಟ್ಯಾಂಪ್‌ಗಳು ಈ ಸಾಧನದಲ್ಲಿ ಸುರಕ್ಷಿತವಾಗಿವೆ.<br>ಮುಂದುವರಿಸಲು ಇಂಟರ್ನೆಟ್‌ಗೆ ಸಂಪರ್ಕಿಸಿ.</p>
<button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
