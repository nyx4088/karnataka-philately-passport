name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site/tests
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/tests/package.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      
      - name: Start local server
        run: |
          cd ..
          python3 -m http.server 8901 &
          echo $! > /tmp/server.pid
          sleep 2
      
      - name: Run Playwright tests
        run: npx playwright test --reporter=html
        env:
          BASE_URL: http://localhost:8901
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/tests/playwright-report/
          retention-days: 30
      
      - name: Stop local server
        if: always()
        run: kill $(cat /tmp/server.pid) || true

  lighthouse:
    runs-on: ubuntu-latest
    needs: playwright
    steps:
      - uses: actions/checkout@v4
      
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://nyx4088.github.io/karnataka-philately-passport/
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
          configPath: ./site/.lighthouserc.json
