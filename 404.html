<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · StampQuest</title>
<meta name="robots" content="noindex">
<style>
  :root{ --paper:#F3EBD8; --surface:#FBF6E9; --ink:#1F1B16; --ink-2:#54493C; --brand:#6B2236; --gold:#D4A94E; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);color:var(--ink);
       font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;padding:24px}
  .stamp{background:var(--surface);max-width:420px;width:100%;text-align:center;padding:40px 32px 36px;position:relative;
         border:2px dashed rgba(107,34,54,.45);border-radius:6px;box-shadow:0 12px 32px rgba(31,27,22,.14)}
  .postmark{width:104px;height:104px;margin:0 auto 8px;border:3px solid var(--brand);border-radius:50%;color:var(--brand);
            display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);opacity:.9}
  .postmark .big{font-family:Georgia,"Times New Roman",serif;font-size:34px;font-weight:700;line-height:1}
  .postmark .small{font-size:9px;letter-spacing:2px;margin-top:4px;font-weight:600}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:24px;margin:14px 0 8px;letter-spacing:.4px}
  p{color:var(--ink-2);font-size:15px;line-height:1.55;margin:0 0 24px}
  a.btn{display:inline-block;background:var(--brand);color:#FBF3E4;text-decoration:none;font-weight:600;font-size:15px;
        padding:12px 22px;border-radius:999px;box-shadow:0 6px 16px rgba(31,27,22,.2)}
  a.btn:hover{background:#571B2C}
  .foot{margin-top:22px;font-size:11px;letter-spacing:2.5px;color:var(--ink-2);font-weight:600}
  .foot b{color:var(--gold)}
</style>
</head>
<body>
  <div class="stamp">
    <div class="postmark"><div class="big">404</div><div class="small">NOT DELIVERED</div></div>

    <a class="btn" href="/karnataka-philately-passport/">Back to StampQuest</a>
    <div class="foot">STAMP<b>QUEST</b> · KARNATAKA</div>
  </div>
</body>
</html>
